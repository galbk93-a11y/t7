<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פולינומים – תחומי חיוביות ושליליות</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1c1d20;--mut:#6a6c72;--ac:#2f5bd9;--pos:#17803f;--neg:#d03a3a;--ln:#dcdad3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--card:#212327;--tx:#eceef1;--mut:#a3a6ad;--ac:#82a4ff;--pos:#4dd388;--neg:#ff7b7b;--ln:#393c42}}
:root[data-theme="dark"]{--bg:#16171a;--card:#212327;--tx:#eceef1;--mut:#a3a6ad;--ac:#82a4ff;--pos:#4dd388;--neg:#ff7b7b;--ln:#393c42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Heebo","Segoe UI",Arial,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 8px}
.intro{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.intro p{margin:0}
.ex{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
.fx{font-size:1.2rem;direction:ltr;unicode-bidi:isolate}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 22px;background:var(--ac);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.cta{text-align:center;margin:24px 0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.card h3{margin:0 0 6px;display:flex;gap:10px;align-items:center;font-size:1.1rem}
.card h3 .fx{font-size:1.1rem}
.svgw{overflow-x:auto}
svg{display:block;width:100%;max-width:460px;margin:8px auto;overflow:hidden;background:transparent}
.ax{stroke:var(--mut);stroke-width:1}
.tk{fill:var(--mut);font-size:10px;text-anchor:middle}
.dom{display:grid;gap:4px;margin-top:6px}
.p{color:var(--pos);font-weight:600}.n{color:var(--neg);font-weight:600}
.note{color:var(--mut);font-size:.9rem;margin-top:6px}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 14px}
ul{margin:4px 0;padding-inline-start:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>פולינומים – תחומי חיוביות ושליליות</h1>

<div id="ex-view">
<div class="intro"><p>לכל פולינום מצאו את האפסים ואת הריבוי שלהם (חותך או משיק), שרטטו סקיצה של הגרף, ומתוכה קבעו את תחומי החיוביות ואת תחומי השליליות.</p></div>
<div id="list"></div>
<div class="cta"><button id="show">לתשובות ולגרפים ←</button></div>
</div>

<div id="ans-view" hidden>
<div class="leg"><span class="p">━ f(x) &gt; 0</span><span class="n">━ f(x) &lt; 0</span><span>● אפסים</span></div>
<div id="answers"></div>
<div class="cta"><button class="sec" id="back">→ חזרה לתרגילים</button></div>
</div>
</main>

<script>
// c: leading coefficient, r: [root, multiplicity], q: irreducible factors x²+bx+c as [b,c]
const E=[
{t:"x³ − 4x",c:1,r:[[-2,1],[0,1],[2,1]],q:[],f:"x(x−2)(x+2)",p:["−2 < x < 0","x > 2"],n:["x < −2","0 < x < 2"]},
{t:"(x+2)(x−1)²(x−3)",c:1,r:[[-2,1],[1,2],[3,1]],q:[],p:["x < −2","x > 3"],n:["−2 < x < 3, x ≠ 1"]},
{t:"(x²+1)(x−2)(x+3)",c:1,r:[[2,1],[-3,1]],q:[[0,1]],k:"x²+1 חיובי תמיד, ולכן לא משפיע על הסימן.",p:["x < −3","x > 2"],n:["−3 < x < 2"]},
{t:"−x³ + 6x² − 9x",c:-1,r:[[0,1],[3,2]],q:[],f:"−x(x−3)²",p:["x < 0"],n:["x > 0, x ≠ 3"]},
{t:"−x²(x+3)(x−2)",c:-1,r:[[0,2],[-3,1],[2,1]],q:[],p:["−3 < x < 2, x ≠ 0"],n:["x < −3","x > 2"]},
{t:"x(x²+4)(x−3)³",c:1,r:[[0,1],[3,3]],q:[[0,4]],k:"x²+4 חיובי תמיד, ולכן לא משפיע על הסימן.",p:["x < 0","x > 3"],n:["0 < x < 3"]},
{t:"−(x²+x+1)(x−1)²(x+2)",c:-1,r:[[1,2],[-2,1]],q:[[1,1]],k:"x²+x+1 חיובי תמיד (הדיסקרימיננטה שלילית: 1 − 4 = −3), ולכן לא משפיע על הסימן.",p:["x < −2"],n:["x > −2, x ≠ 1"]},
{t:"x(x−2)³(x+1)",c:1,r:[[0,1],[2,3],[-1,1]],q:[],p:["−1 < x < 0","x > 2"],n:["x < −1","0 < x < 2"]},
{t:"−(x+1)³(x−4)²",c:-1,r:[[-1,3],[4,2]],q:[],p:["x < −1"],n:["x > −1, x ≠ 4"]}
];
const fm=n=>(n<0?"−":"")+Math.abs(n);
const ev=(e,x)=>{let v=e.c;e.r.forEach(([r,m])=>v*=Math.pow(x-r,m));e.q.forEach(([b,c])=>v*=x*x+b*x+c);return v};
const iv=a=>a.map(s=>`<span dir="ltr">${s}</span>`).join(" או ");
const kind=m=>m==1?"חותך":m%2==0?"משיק":"חותך ומתיישר";

function graph(e){
  const rs=e.r.map(a=>a[0]),mn=Math.min(...rs),mx=Math.max(...rs);
  const x0=mn-1.5,x1=mx+1.5,W=360,H=240;
  let Y=0;for(let x=mn-.6;x<=mx+.6;x+=.02)Y=Math.max(Y,Math.abs(ev(e,x)));
  Y=Math.max(Y*1.3,1);
  const px=x=>(x-x0)/(x1-x0)*W,py=y=>H/2-y/Y*(H/2);
  let P="",N="";
  for(let x=x0;x<x1;x+=.05){
    const a=ev(e,x),b=ev(e,x+.05),s=`M${px(x).toFixed(1)} ${py(a).toFixed(1)}L${px(x+.05).toFixed(1)} ${py(b).toFixed(1)}`;
    if(ev(e,x+.025)>=0)P+=s;else N+=s;
  }
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף הפולינום">`;
  g+=`<line class="ax" x1="0" y1="${H/2}" x2="${W}" y2="${H/2}"/>`;
  if(x0<0&&x1>0)g+=`<line class="ax" x1="${px(0)}" y1="0" x2="${px(0)}" y2="${H}"/>`;
  for(let i=Math.ceil(x0);i<=Math.floor(x1);i++){
    g+=`<line class="ax" x1="${px(i)}" y1="${H/2-3}" x2="${px(i)}" y2="${H/2+3}"/><text class="tk" x="${px(i)}" y="${H/2+15}">${fm(i)}</text>`;
  }
  g+=`<path d="${P}" fill="none" stroke="var(--pos)" stroke-width="2.6" stroke-linecap="round"/>`;
  g+=`<path d="${N}" fill="none" stroke="var(--neg)" stroke-width="2.6" stroke-linecap="round"/>`;
  rs.forEach(r=>g+=`<circle cx="${px(r)}" cy="${H/2}" r="4.5" fill="var(--ac)" stroke="var(--card)" stroke-width="1.5"/>`);
  return g+"</svg>";
}

document.getElementById("list").innerHTML=E.map((e,i)=>
  `<div class="ex"><div class="num">${i+1}</div><div class="fx">f(x) = ${e.t}</div></div>`).join("");

let built=false;
function build(){
  if(built)return;built=true;
  document.getElementById("answers").innerHTML=E.map((e,i)=>{
    const d=e.r.reduce((s,a)=>s+a[1],0)+2*e.q.length;
    const z=[...e.r].sort((a,b)=>a[0]-b[0]).map(([r,m])=>`<li><span dir="ltr">x = ${fm(r)}</span> — ריבוי ${m} (${kind(m)})</li>`).join("");
    return `<div class="card"><h3><span class="num">${i+1}</span><span class="fx">f(x) = ${e.t}</span></h3>
      ${e.f?`<div>צורה מפורקת: <span class="fx" dir="ltr">${e.f}</span></div>`:""}
      <div>מעלת הפולינום: <b>${d}</b> · המקדם המוביל: <b class="${e.c>0?'p':'n'}">${e.c>0?'חיובי':'שלילי'}</b></div>
      <div>אפסים:</div><ul>${z}</ul>
      <div class="svgw">${graph(e)}</div>
      <div class="dom"><div><span class="p">חיובי (f(x) &gt; 0):</span> ${iv(e.p)}</div><div><span class="n">שלילי (f(x) &lt; 0):</span> ${iv(e.n)}</div></div>
      ${e.k?`<div class="note">${e.k}</div>`:""}</div>`;
  }).join("");
}
const ex=document.getElementById("ex-view"),an=document.getElementById("ans-view");
document.getElementById("show").onclick=()=>{build();ex.hidden=true;an.hidden=false;window.scrollTo(0,0)};
document.getElementById("back").onclick=()=>{an.hidden=true;ex.hidden=false;window.scrollTo(0,0)};
</script>
</body>
</html>
